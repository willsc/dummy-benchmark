[workspace]
resolver = "2"
members = [
    "crates/shmbus",
    "crates/feedhandler",
    "crates/trading-engine",
    "crates/mock-exchange",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shmbus = { path = "crates/shmbus" }
memmap2 = "0.9"
libc  = "0.2"
io-uring = "0.7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
ctrlc = "3"
crossbeam-utils = "0.8"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
